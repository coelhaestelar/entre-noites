<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entre Noites</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">

</head>

<body>

    <!-- Background -->

    <div class="background"></div>

    <!-- Topography -->

    <img
        src="assets/svg/topography1.svg"
        class="topography topography-1"
        alt="">

    <img
        src="assets/svg/topography2.svg"
        class="topography topography-2"
        alt="">

    <!-- Editorial Frame -->

    <div class="editorial-frame"></div>

    <main>

        <!-- ======================================
             Scene 01 — Opening
        ======================================= -->

        <section class="scene scene--opening">

            <div class="envelope">

                <!-- Letter -->

                <article class="letter">

                    <div class="letter-content">

                     <main class="invitation">

                    <!-- CHAPTER V — HERO -->
                    
                    <section class="chapter chapter-hero">

                    <!-- HERO -->

                        <section class="hero" aria-label="Abertura do convite">

                            <div class="hero-content">

                                <h1 class="hero-names">
                                    THAÍS
                                    <span class="hero-ampersand">&amp;</span>
                                    WENDELL
                                </h1>

                                <span class="hero-date">
                                    30 · 10 · 2026
                                </span>

                                <span class="hero-concept">
                                    Entre Noites
                                </span>

                            </div>

                        </section>

                    </section>    
                    
                     <!-- CHAPTER VI — THE NIGHT -->
                        <section class="chapter chapter-night">

                            <div class="night-content">

                                <span class="night-date">
                                    30 DE OUTUBRO DE 2026
                                </span>

                                <span class="night-location">
                                    SÃO PAULO, SP
                                </span>

                                <p class="night-message">
                                    uma noite para atravessarmos juntos
                                </p>

                            </div>

                        </section>


                        </main>
                    

                    </div>

                </article>

                <!-- Envelope -->

                    <img
                        src="assets/images/envelope-body.png"
                        class="envelope-body"
                        alt="">

                <div class="flap">

                    <img
                        src="assets/images/flap-top.png"
                        class="flap-top"
                        alt="">

                </div>

                <!-- Seal -->

                <button
                    class="seal"
                    aria-label="Abrir convite">

                    <img
                        src="assets/images/seal.png"
                        class="seal-image"
                        alt="">

                </button>

            </div>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
